name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KubeSec-master

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install pandas numpy PyYAML ruamel.yaml requests typer
          pip install sarif-om jschema-to-python

      - name: Lint with Ruff
        run: |
          ruff check . --select E9,F63,F7,F82
          ruff check . --exit-zero

      - name: Run parsing tests
        run: python TEST_PARSING.py

      - name: Run scanning tests
        continue-on-error: true
        run: python TEST_SCANNING.py

      - name: Run graph tests
        continue-on-error: true
        run: python TEST_GRAPH.py

      - name: Run integration tests
        continue-on-error: true
        run: python TEST_INTEGRATION.py
